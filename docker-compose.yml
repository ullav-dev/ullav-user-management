services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: user_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d user_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://app_user:app_password@db:5432/user_management
      JWT_SECRET: change_me_to_a_long_random_string
      JWT_TTL_HOURS: "24"
      RESET_TOKEN_TTL_MINUTES: "30"
      PORT: "8081"
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
